name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: |
          python -m pip install --quiet pyyaml
          python tools/validate_repo.py
      - name: Test codex-plan-files
        run: python -m unittest discover -s plugins/agent-workflow/skills/codex-plan-files/scripts
      - name: Test map presentation validator
        run: python -m unittest discover -s plugins/wargame-design/skills/wargame-scenario-map-making/assets/v32 -p test_presentation.py

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Claude Code marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate .
      - name: Build skill zips
        shell: pwsh
        run: ./scripts/Build-SkillZips.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
